<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal  | KY Intermediater's</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        .tracker-container { max-width: 600px; margin: 4rem auto; }
        .step { display: flex; align-items: flex-start; margin-bottom: 2rem; position: relative; }
        .step::after {
            content: ''; position: absolute; left: 15px; top: 35px; bottom: -20px;
            width: 2px; background: #e2e8f0; z-index: 1;
        }
        .step:last-child::after { display: none; }
        .step-circle {
            width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; 
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: bold; z-index: 2; margin-right: 1.5rem; flex-shrink: 0;
        }
        .step.active .step-circle { background: var(--accent); }
        .step.completed .step-circle { background: #10b981; }
        .step.completed::after { background: #10b981; }
        .step-content h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
        .step-content p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0; }
        
        .activity-log { margin-top: 3rem; background: rgba(0,0,0,0.02); padding: 1.5rem; border-radius: 4px; border: 1px solid rgba(0,0,0,0.05); }
        .log-item { font-size: 0.85rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem; }
        .log-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .log-date { color: var(--accent); font-weight: bold; margin-right: 0.5rem; }
    </style>
</head>
<body style="background: #f8fafc;">

    <header style="background: #0f172a; padding: 1rem 0;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="images/favicon.png" alt="KY Logo" style="height: 50px;">
                <span style="color: white; font-weight: bold; letter-spacing: 2px; margin-left: 1rem;">KY INTERMEDIATER'S</span>
            </a>
        </div>
    </header>

    <main class="container tracker-container">
        <h1 style="text-align: center; margin-bottom: 1rem;">Application Tracker</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 3rem;">Track the real-time status of your venture application.</p>

        <div id="loading" style="text-align: center; padding: 4rem;">Loading securely...</div>
        
        <div id="errorBox" style="display: none; text-align: center; color: red; padding: 2rem; background: #fee2e2; border-radius: 4px;">
            Invalid or Expired Tracking Link.
        </div>

        <div id="trackerData" style="display: none;">
            <div class="glass-panel" style="padding: 2rem; margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 0.5rem;">Assigned Analyst</h3>
                <p><strong><span id="agentName" style="color: var(--accent);">Unassigned</span></strong></p>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Your dedicated analyst will guide you through the next steps.</p>
            </div>

            <div class="glass-panel" style="padding: 2rem;">
                <div id="statusSteps">
                    <!-- Steps will be injected here by JS -->
                </div>

                <div class="activity-log">
                    <h4 style="margin-bottom: 1rem;">Activity Log</h4>
                    <div id="activityLogContainer"></div>
                </div>
            </div>
            
            <div id="docsSection" class="glass-panel" style="padding: 2rem; margin-top: 2rem; display: none;">
                <h3 style="margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 0.5rem;">Secure Documents</h3>
                <ul id="docsList" style="list-style: none; padding: 0;"></ul>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const statusMap = {
            "New Lead": 1,
            "Contacted": 2,
            "Proposal": 3,
            "Closed": 4
        };
        const statusSteps = ["Application Received", "Initial Contact / Strategy Call", "Proposal & Due Diligence", "Closed / Venture Activated"];

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            try {
                const data = await KYApi.fetchPortalData(id);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('trackerData').style.display = 'block';
                
                document.getElementById('agentName').textContent = data.agent;
                
                let currentStepIndex = statusMap[data.status] || 1;
                
                // Build Tracker
                let stepsHTML = '';
                statusSteps.forEach((stepName, i) => {
                    const stepNum = i + 1;
                    let stateClass = '';
                    if (stepNum < currentStepIndex) stateClass = 'completed';
                    else if (stepNum === currentStepIndex) stateClass = 'active';

                    stepsHTML += `
                        <div class="step ${stateClass}">
                            <div class="step-circle">${stepNum < currentStepIndex ? '✓' : stepNum}</div>
                            <div class="step-content">
                                <h3>${stepName}</h3>
                                ${stepNum === currentStepIndex ? '<p>Currently in progress.</p>' : ''}
                            </div>
                        </div>
                    `;
                });
                document.getElementById('statusSteps').innerHTML = stepsHTML;

                // Build Activity Log
                let logsHTML = '';
                [...data.logs].reverse().forEach(log => {
                    const date = new Date(log.time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    logsHTML += `<div class="log-item"><span class="log-date">${date}</span> ${log.action}</div>`;
                });
                document.getElementById('activityLogContainer').innerHTML = logsHTML;
                
                // Docs
                if (data.docs && data.docs.length > 0) {
                    document.getElementById('docsSection').style.display = 'block';
                    let docsHTML = '';
                    data.docs.forEach(doc => {
                        docsHTML += `<li style="margin-bottom: 0.5rem;"><a href="${doc.url}" target="_blank" style="color: var(--accent); font-weight: bold; text-decoration: none;">📄 ${doc.name}</a></li>`;
                    });
                    document.getElementById('docsList').innerHTML = docsHTML;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
            }
        });
    </script>
</body>
</html>
