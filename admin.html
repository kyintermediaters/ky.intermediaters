<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KY Intermediater's</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="KY Intermediater's Logo"></a>
            <nav class="nav-links">
                <a href="index.html">Back to Site</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 8rem; min-height: calc(100vh - 150px);">
        
        <!-- Login Section -->
        <div id="login-section" class="glass-panel admin-login">
            <h2 style="text-align: center; margin-bottom: 2rem;">Admin Login</h2>
            <div id="login-error" style="color: var(--error); margin-bottom: 1rem; text-align: center; display: none;">Invalid Password</div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="checkPassword()">Login</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem;">(Hint: password is "admin123")</p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Customer Registrations</h2>
                <button class="btn btn-outline" onclick="loadData()" id="refresh-btn">Refresh Data</button>
            </div>
            
            <div class="glass-panel data-table-container">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 1200px;">
                        <thead>
                            <tr style="border-bottom: 2px solid rgba(0,0,0,0.1);">
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Timestamp</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Name</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Email</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Phone</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Interest</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Capital</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Location</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Occupation</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Experience</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Motivation</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Goal</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Timeline</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Time Comm.</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Type</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Risk</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="15" style="text-align: center; padding: 2rem;">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        function checkPassword() {
            const pwd = document.getElementById('password').value;
            if (pwd === 'admin123') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadData();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            const refreshBtn = document.getElementById('refresh-btn');
            
            refreshBtn.textContent = 'Refreshing...';
            refreshBtn.disabled = true;
            tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 2rem;">Fetching data from Google Sheets...</td></tr>';
            
            try {
                const data = await fetchRegistrations();
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 2rem;">No registrations found.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); white-space: nowrap;">${new Date(row[0]).toLocaleString() || 'N/A'}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 500; color: var(--text-primary); white-space: nowrap;">${row[1] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[2] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); white-space: nowrap;">${row[3] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);"><span style="background: rgba(0,0,0,0.05); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; white-space: nowrap;">${row[4] || ''}</span></td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[5] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[6] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[7] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[8] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); min-width: 200px;">${row[9] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[10] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[11] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[12] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[13] || ''}</td>
                        <td style="padding: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05);">${row[14] || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="15" style="text-align: center; padding: 2rem; color: var(--error);">Error: ${error.message} <br><br> (Did you set up the Google Apps Script Web App URL in js/api.js?)</td></tr>`;
            } finally {
                refreshBtn.textContent = 'Refresh Data';
                refreshBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
