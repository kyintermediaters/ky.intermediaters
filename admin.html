<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KY Intermediater's</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div id="preloader">
        <img src="images/logo.png" alt="Loading..." class="loader-logo">
    </div>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="KY Intermediater's Logo"></a>
            <nav class="nav-links">
                <a href="index.html">Back to Site</a>
            </nav>
        </div>
    </header>


    <main style="padding-top: 150px; min-height: 80vh;">
        <!-- Login Screen -->
        <div id="adminLogin" class="container" style="max-width: 500px; text-align: center;">
            <div class="glass-panel">
                <h2 style="margin-bottom: 2rem;">Admin Access</h2>
                <input type="password" id="adminPassword" placeholder="Enter Password" class="form-input" style="margin-bottom: 1rem;">
                <button id="loginBtn" class="btn btn-primary" style="width: 100%;">Unlock Dashboard</button>
                <p id="loginError" style="color: red; margin-top: 1rem; display: none;">Incorrect password.</p>
            </div>
        </div>

        <!-- Dashboard Content (Hidden by default) -->
        <div id="adminDashboard" class="container" style="display: none; padding-bottom: 5rem;">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; gap: 1rem;">
                <div>
                    <h1 class="section-title" style="margin-bottom: 0.5rem; font-size: 2.5rem;">Lead Manager</h1>
                    <p style="color: var(--text-secondary);">Secure real-time feed</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <input type="text" id="searchInput" placeholder="Search leads..." style="padding: 0.8rem 1.5rem; border-radius: 30px; border: 1px solid rgba(0,0,0,0.1); width: 250px; font-family: inherit;">
                    <button id="refreshBtn" class="btn btn-outline">Refresh</button>
                </div>
            </div>
            
            <div id="leadsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;">
                <!-- Cards will be injected here -->
                <div id="loadingState" style="grid-column: 1 / -1; text-align: center; padding: 4rem;">Loading data...</div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
        window.copyData = function(text, btn) {
            if(!text || text === 'undefined') return;
            navigator.clipboard.writeText(text);
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            btn.style.backgroundColor = 'var(--accent)';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = 'transparent';
                btn.style.color = 'var(--text-primary)';
            }, 2000);
        };

        // Toggle Meeting Form
        window.toggleMeetingForm = function(btn) {
            const form = btn.nextElementSibling;
            if (form.style.display === "none") {
                form.style.display = "block";
                btn.innerText = "Cancel";
            } else {
                form.style.display = "none";
                btn.innerText = "Schedule Google Meet";
            }
        };

        // Schedule Meeting
        window.scheduleMeeting = async function(email, name, btn) {
            const form = btn.parentElement;
            const dateInput = form.querySelector(".meeting-date").value;
            const timeInput = form.querySelector(".meeting-time").value;

            if (!dateInput || !timeInput) {
                alert("Please select both a date and a time.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Scheduling...";

            try {
                await KYApi.scheduleMeeting(email, name, dateInput, timeInput);
                alert(`Meeting successfully scheduled! A Google Calendar invite has been sent to ${email}.`);
                form.style.display = "none";
                form.previousElementSibling.innerText = "Meeting Scheduled ✓";
                form.previousElementSibling.disabled = true;
                form.previousElementSibling.style.background = "#e2e8f0";
                form.previousElementSibling.style.color = "#475569";
                form.previousElementSibling.style.border = "none";
            } catch (error) {
                alert("Failed to schedule: " + error.message);
                btn.disabled = false;
                btn.innerText = "Send Invite";
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const loginScreen = document.getElementById('adminLogin');
            const dashboard = document.getElementById('adminDashboard');
            const loginBtn = document.getElementById('loginBtn');
            const passInput = document.getElementById('adminPassword');
            const loginError = document.getElementById('loginError');
            const leadsGrid = document.getElementById('leadsGrid');
            const searchInput = document.getElementById('searchInput');
            let allLeads = [];

            if (sessionStorage.getItem('ky_admin_auth') === 'true') {
                loginScreen.style.display = 'none';
                dashboard.style.display = 'block';
                loadData();
            }

            loginBtn.addEventListener('click', () => {
                if (passInput.value === 'adminkypass') {
                    sessionStorage.setItem('ky_admin_auth', 'true');
                    loginScreen.style.display = 'none';
                    dashboard.style.display = 'block';
                    loadData();
                } else {
                    loginError.style.display = 'block';
                }
            });

            document.getElementById('refreshBtn').addEventListener('click', loadData);

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allLeads.filter(lead => {
                    const searchable = (lead[1] + ' ' + lead[2] + ' ' + lead[3] + ' ' + lead[4] + ' ' + lead[6]).toLowerCase();
                    return searchable.includes(term);
                });
                renderLeads(filtered);
            });

            async function loadData() {
                const refreshBtn = document.getElementById('refreshBtn');
                refreshBtn.textContent = 'Refreshing...';
                leadsGrid.innerHTML = '<div id="loadingState" style="grid-column: 1 / -1; text-align: center; padding: 4rem;">Loading data...</div>';
                
                try {
                    const submissions = await KYApi.getRegistrations();
                    if (submissions.length === 0) {
                        leadsGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 4rem;">No leads found.</div>';
                        return;
                    }
                    
                    allLeads = submissions.reverse();
                    renderLeads(allLeads);
                } catch (error) {
                    leadsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: red; padding: 4rem;">Error loading data.</div>`;
                } finally {
                    refreshBtn.textContent = 'Refresh';
                }
            }

            function renderLeads(leads) {
                leadsGrid.innerHTML = '';
                if(leads.length === 0) {
                    leadsGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 4rem;">No matching leads.</div>';
                    return;
                }

                leads.forEach(row => {
                    const date = new Date(row[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    const card = document.createElement('div');
                    card.className = 'glass-panel';
                    card.style.padding = '1.5rem';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.gap = '1rem';
                    card.style.transition = 'transform 0.2s';
                    card.onmouseover = () => card.style.transform = 'translateY(-5px)';
                    card.onmouseout = () => card.style.transform = 'translateY(0)';

                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem; margin-bottom: 1rem;">
                            <div>
                                <h3 style="margin-bottom: 0.2rem;">${row[1] || 'Unknown'}</h3>
                                <p style="font-size: 0.8rem; color: var(--text-secondary);">${date}</p>
                            </div>
                            <div style="background: rgba(156, 123, 56, 0.1); color: var(--accent); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">
                                ₹${row[5] || '-'}
                            </div>
                        </div>

                        <div style="font-size: 0.85rem; margin-top: -0.5rem;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <span><strong>Email:</strong> <span style="color: var(--text-secondary);">${row[2] || '-'}</span></span>
                                <button onclick="copyData('${row[2]}', this)" class="btn btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.7rem; min-width: 50px;">Copy</button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem; margin-bottom: 1rem;">
                                <span><strong>Phone:</strong> <span style="color: var(--text-secondary);">${row[3] || '-'}</span></span>
                                <button onclick="copyData('${row[3]}', this)" class="btn btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.7rem; min-width: 50px;">Copy</button>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; font-size: 0.85rem;">
                            <div><strong>Interest:</strong><br>${row[4] || '-'}</div>
                            <div><strong>Location:</strong><br>${row[6] || '-'}</div>
                            <div><strong>Occupation:</strong><br>${row[7] || '-'}</div>
                            <div><strong>Timeline:</strong><br>${row[11] || '-'}</div>
                            <div><strong>Type:</strong><br>${row[13] || '-'}</div>
                            <div><strong>Risk:</strong><br>${row[14] || '-'}</div>
                            <div style="grid-column: 1/-1;"><strong>Goal:</strong><br><span style="color:var(--text-secondary)">${row[10] || '-'}</span></div>
                        </div>

                        <div style="margin-top: 1.5rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1rem;">
                            <button onclick="toggleMeetingForm(this)" class="btn btn-outline" style="width: 100%; font-size: 0.8rem;">Schedule Google Meet</button>
                            
                            <div class="meeting-form" style="display: none; margin-top: 1rem; background: #f1f5f9; padding: 1rem; border-radius: 4px; border: 1px solid rgba(0,0,0,0.05);">
                                <label style="font-size: 0.75rem; font-weight: bold; color: var(--text-secondary);">Date</label>
                                <input type="date" class="meeting-date" style="width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                                
                                <label style="font-size: 0.75rem; font-weight: bold; color: var(--text-secondary);">Time</label>
                                <input type="time" class="meeting-time" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                                
                                <button onclick="scheduleMeeting('${row[2]}', '${row[1]}', this)" class="btn btn-primary" style="width: 100%; font-size: 0.8rem;">Send Invite</button>
                            </div>
                        </div>
                    `;
                    leadsGrid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
