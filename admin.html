<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KY Intermediater's</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div id="preloader">
        <img src="images/logo.png" alt="Loading..." class="loader-logo">
    </div>
    <div class="custom-cursor"></div>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="KY Intermediater's Logo"></a>
            <nav class="nav-links">
                <a href="index.html">Back to Site</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 8rem; min-height: calc(100vh - 150px);">
        
        <!-- Login Section -->
        <div id="login-section" class="glass-panel admin-login">
            <h2 style="text-align: center; margin-bottom: 2rem;">Admin Login</h2>
            <div id="login-error" style="color: var(--error); margin-bottom: 1rem; text-align: center; display: none;">Invalid Password</div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password">
    <main style="padding-top: 150px; min-height: 80vh;">
        <!-- Login Screen -->
        <div id="adminLogin" class="container" style="max-width: 500px; text-align: center;">
            <div class="glass-panel">
                <h2 style="margin-bottom: 2rem;">Admin Access</h2>
                <input type="password" id="adminPassword" placeholder="Enter Password" class="form-input" style="margin-bottom: 1rem;">
                <button id="loginBtn" class="btn btn-primary" style="width: 100%;">Unlock Dashboard</button>
                <p id="loginError" style="color: red; margin-top: 1rem; display: none;">Incorrect password.</p>
            </div>
        </div>

        <!-- Dashboard Content (Hidden by default) -->
        <div id="adminDashboard" class="container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
                <div>
                    <h1 class="section-title" style="margin-bottom: 0.5rem; font-size: 2.5rem;">Client Submissions</h1>
                    <p style="color: var(--text-secondary);">Real-time feed from Google Sheets</p>
                </div>
                <button id="refreshBtn" class="btn btn-outline">Refresh Data</button>
            </div>
            
            <div class="glass-panel data-table-container">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 1200px;">
                        <thead>
                            <tr style="border-bottom: 2px solid rgba(0,0,0,0.1);">
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Timestamp</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Name</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Email</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Phone</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Interest</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Capital</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Location</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Occupation</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Experience</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Motivation</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Goal</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Timeline</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Time Comm.</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Type</th>
                                <th style="padding: 1rem; font-weight: 600; color: var(--text-secondary);">Risk</th>
                            </tr>
                        </thead>
                        <tbody id="submissionsBody">
                            <tr><td colspan="15" style="text-align: center; padding: 2rem;" id="loadingState">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginScreen = document.getElementById('adminLogin');
            const dashboard = document.getElementById('adminDashboard');
            const loginBtn = document.getElementById('loginBtn');
            const passInput = document.getElementById('adminPassword');
            const loginError = document.getElementById('loginError');

            if (sessionStorage.getItem('ky_admin_auth') === 'true') {
                loginScreen.style.display = 'none';
                dashboard.style.display = 'block';
                loadData();
            }

            loginBtn.addEventListener('click', () => {
                if (passInput.value === 'KYAdmin2026') {
                    sessionStorage.setItem('ky_admin_auth', 'true');
                    loginScreen.style.display = 'none';
                    dashboard.style.display = 'block';
                    loadData();
                } else {
                    loginError.style.display = 'block';
                }
            });

            document.getElementById('refreshBtn').addEventListener('click', loadData);

            async function loadData() {
                const tbody = document.getElementById('submissionsBody');
                const refreshBtn = document.getElementById('refreshBtn');
                refreshBtn.textContent = 'Refreshing...';
                tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 2rem;">Loading data...</td></tr>';
                
                try {
                    const submissions = await KYApi.getRegistrations();
                    tbody.innerHTML = '';
                    
                    if (submissions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 2rem;">No submissions yet</td></tr>';
                        return;
                    }
                    
                    submissions.reverse().forEach(row => {
                        const tr = document.createElement('tr');
                        const cells = [
                            new Date(row[0]).toLocaleDateString(), row[1], row[2], row[3], row[4], 
                            row[5], row[6], row[7], row[8], row[9], row[10], row[11], row[12], row[13], row[14]
                        ];
                        cells.forEach(cell => {
                            const td = document.createElement('td');
                            td.style.padding = '1rem';
                            td.style.borderBottom = '1px solid rgba(0,0,0,0.05)';
                            td.textContent = cell || '-';
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                } catch (error) {
                    tbody.innerHTML = `<tr><td colspan="15" style="text-align: center; color: red; padding: 2rem;">Error loading data.</td></tr>`;
                } finally {
                    refreshBtn.textContent = 'Refresh Data';
                }
            }
        });
    </script>
</body>
</html>
