<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | KY Intermediater's</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">KY INTERMEDIATER'S</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 8rem; min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 100%; max-width: 500px;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Register Now</h2>
            
            <div id="alert-message" style="display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+91 9876543210">
                </div>
                
                <div class="form-group">
                    <label for="interest">Area of Interest / Industry</label>
                    <select id="interest" name="interest" required>
                        <option value="" disabled selected>Select an industry</option>
                        <option value="Technology">Technology & IT</option>
                        <option value="Food & Beverage">Food & Beverage</option>
                        <option value="Retail & E-commerce">Retail & E-commerce</option>
                        <option value="Healthcare">Healthcare & Fitness</option>
                        <option value="Education">Education & EdTech</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Available Capital (Approximate)</label>
                    <input type="text" id="budget" name="budget" placeholder="e.g. ₹50,000" required>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 2.5rem 0;">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Demographics & Background</h3>

                <div class="form-group">
                    <label for="location">Location / City</label>
                    <input type="text" id="location" name="location" placeholder="e.g. Mumbai, Maharashtra" required>
                </div>

                <div class="form-group">
                    <label for="occupation">Current Occupation</label>
                    <input type="text" id="occupation" name="occupation" placeholder="e.g. Software Engineer, Student" required>
                </div>

                <div class="form-group">
                    <label for="experience">Prior Business Experience</label>
                    <select id="experience" name="experience" required>
                        <option value="" disabled selected>Select experience level</option>
                        <option value="None">None - First time entrepreneur</option>
                        <option value="Some">Some - Tried a few side hustles</option>
                        <option value="Experienced">Experienced - Have run a business before</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 2.5rem 0;">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Motivations & Goals</h3>

                <div class="form-group">
                    <label for="motivation">Why do you want to start a business?</label>
                    <textarea id="motivation" name="motivation" rows="3" placeholder="Briefly describe what's driving you..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="goal">Primary Goal</label>
                    <select id="goal" name="goal" required>
                        <option value="" disabled selected>Select primary goal</option>
                        <option value="Passive">Passive income stream</option>
                        <option value="Replace Job">Replace full-time job</option>
                        <option value="Scalable Startup">Build a highly scalable startup</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="timeline">Preferred Timeline to Launch</label>
                    <select id="timeline" name="timeline" required>
                        <option value="" disabled selected>Select timeline</option>
                        <option value="Immediate">Immediately (0-1 month)</option>
                        <option value="Short-term">1-3 months</option>
                        <option value="Medium-term">3-6 months</option>
                        <option value="Long-term">6+ months</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 2.5rem 0;">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Operational Capacity</h3>

                <div class="form-group">
                    <label for="time">Time Commitment</label>
                    <select id="time" name="time" required>
                        <option value="" disabled selected>Select hours per week</option>
                        <option value="0-10">0-10 hours/week</option>
                        <option value="10-20">10-20 hours/week</option>
                        <option value="20-40">20-40 hours/week</option>
                        <option value="Full-time">Full-time (40+ hours)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="venture_type">Venture Type</label>
                    <select id="venture_type" name="venture_type" required>
                        <option value="" disabled selected>Select preference</option>
                        <option value="Solo">Solo venture</option>
                        <option value="Co-founders">Looking for co-founders</option>
                        <option value="Open">Open to both</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="risk">Risk Tolerance</label>
                    <select id="risk" name="risk" required>
                        <option value="" disabled selected>Select risk tolerance</option>
                        <option value="Low">Low - Steady & Safe</option>
                        <option value="Medium">Medium - Balanced</option>
                        <option value="High">High - Big Risk / Big Reward</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem;" id="submit-btn">
                    Submit Details & Pay ₹----- Later
                </button>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-message');
            const form = e.target;
            
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await submitRegistration(data);
                
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = 'rgba(0, 204, 102, 0.2)';
                alertBox.style.border = '1px solid var(--success)';
                alertBox.style.color = 'var(--text-primary)';
                alertBox.textContent = 'Registration successful! We will contact you shortly.';
                
                form.reset();
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = 'rgba(255, 77, 77, 0.2)';
                alertBox.style.border = '1px solid var(--error)';
                alertBox.style.color = 'var(--text-primary)';
                alertBox.textContent = error.message || 'Something went wrong. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Details & Pay ₹----- Later';
            }
        });
    </script>
</body>
</html>
